name: Remove backtest panel

on:
  push:
    branches:
      - feat/sorteio-historico-10-anos
    paths:
      - .github/workflows/remove-backtest-panel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sorteio-historico-10-anos
      - name: Remover painel de backtest
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('sorteio-analytics.js')
          s = p.read_text()
          pattern = r'<article class="panel hist10-panel"><div class="result-topline"><div><div class="eyebrow">Validação</div><h2>Backtest dinâmico</h2>.*?</article>'
          ns, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Painel não encontrado: {n}')
          p.write_text(ns)
          PY
          node --check sorteio-analytics.js
      - name: Commitar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorteio-analytics.js
          git commit -m "fix: remove dependência de backtest externo do simulador"
          git push origin HEAD:feat/sorteio-historico-10-anos
