name: Build Federal 10Y history

on:
  push:
    branches:
      - feat/sorteio-historico-10-anos
    paths:
      - scripts/build-federal-history-10y.mjs
      - .github/workflows/build-federal-history-10y.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sorteio-historico-10-anos
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar histórico comprimido
        run: node scripts/build-federal-history-10y.mjs
      - name: Commitar base atualizada
        run: |
          if [ -z "$(git status --porcelain -- federal-history-10y.js)" ]; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add federal-history-10y.js
          git commit -m "data: atualiza histórico Federal 2016-2026"
          git push origin HEAD:feat/sorteio-historico-10-anos
