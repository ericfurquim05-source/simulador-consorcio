name: Integrate Sorteio 10Y

on:
  push:
    branches:
      - feat/sorteio-historico-10-anos
    paths:
      - .github/workflows/integrate-sorteio-10y.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sorteio-historico-10-anos
      - name: Integrar scripts e cache PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = '''  <script src="./federal-history.js?v=330" defer></script>\n  <script src="./sorteio.js?v=351" defer></script>'''
          new = '''  <script src="./federal-history.js?v=360" defer></script>\n  <script src="./federal-history-10y.js?v=360" defer></script>\n  <script src="./sorteio.js?v=360" defer></script>\n  <script src="./sorteio-analytics.js?v=360" defer></script>'''
          if old not in text:
              raise SystemExit('Bloco de scripts esperado não encontrado em index.html')
          text = text.replace(old, new, 1)
          text = text.replace('Simulador de Consórcio — v3.5.1', 'Simulador de Consórcio — v3.6.0', 1)
          text = text.replace('Simulações claras para apresentar ao cliente · v3.5.1', 'Simulações claras para apresentar ao cliente · v3.6.0', 1)
          index.write_text(text)

          sw = Path('service-worker.js')
          text = sw.read_text()
          text = text.replace("const VERSION = 'simulador-consorcio-v3.5.1-clareza-cobertura';", "const VERSION = 'simulador-consorcio-v3.6.0-historico-10y';", 1)
          old_assets = "  './sorteio.js',\n  './federal-history.js',"
          new_assets = "  './sorteio.js',\n  './sorteio-analytics.js',\n  './federal-history.js',\n  './federal-history-10y.js',"
          if old_assets not in text:
              raise SystemExit('Bloco de assets esperado não encontrado em service-worker.js')
          text = text.replace(old_assets, new_assets, 1)
          sw.write_text(text)
          PY
      - name: Validar JavaScript
        run: |
          node --check federal-history.js
          node --check federal-history-10y.js
          node --check sorteio.js
          node --check sorteio-analytics.js
          node --check service-worker.js
      - name: Commitar integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "feat: integra histórico de 10 anos na aba Sorteio"
          git push origin HEAD:feat/sorteio-historico-10-anos
