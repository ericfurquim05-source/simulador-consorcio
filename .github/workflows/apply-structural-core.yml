name: Apply Structural Core

on:
  push:
    branches:
      - feat/sorteio-historico-10-anos
    paths:
      - .github/workflows/apply-structural-core.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sorteio-historico-10-anos
      - name: Atualizar radar principal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sorteio.js')
          s=p.read_text()
          s=s.replace('const MIN_QUOTA_DISTANCE = 21;', 'const MIN_QUOTA_DISTANCE = 1;', 1)
          old='''  function computeMatches(reference){\n    const ref = Number(reference);\n    const matches = [];'''
          new='''  function computeMatches(reference){\n    const structuralEngine = global.SORTEIO_STRUCTURAL_ENGINE;\n    if(structuralEngine && typeof structuralEngine.matchesForClients === 'function'){\n      const structuralMatches = structuralEngine.matchesForClients(reference, state.clients);\n      if(Array.isArray(structuralMatches)) return structuralMatches;\n    }\n\n    const ref = Number(reference);\n    const matches = [];'''
          if old not in s:
              raise SystemExit('computeMatches esperado não encontrado')
          s=s.replace(old,new,1)
          s=s.replace("' cota na faixa de ±10.'", "' cota no alcance ativo.'")
          s=s.replace("' cotas na faixa de ±10.'", "' cotas no alcance ativo.'")
          s=s.replace("'Conferência feita. Nenhuma cota ficou na faixa de ±10.'", "'Conferência feita. Nenhuma cota cadastrada ficou no alcance ativo.'")
          p.write_text(s)

          sw=Path('service-worker.js')
          t=sw.read_text().replace("simulador-consorcio-v3.6.0-historico-10y", "simulador-consorcio-v3.6.1-alcance-ativo", 1)
          sw.write_text(t)
          PY
      - name: Validar JavaScript
        run: |
          node --check sorteio.js
          node --check sorteio-analytics.js
          node --check federal-history-10y.js
          node --check service-worker.js
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorteio.js service-worker.js
          git commit -m "feat: usa posição entre cotas ativas no radar"
          git push origin HEAD:feat/sorteio-historico-10-anos
